[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpinn"
version = "0.0.2"
description = "Physics-informed graph neural networks with second-order optimization"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [{ name = "Kiarash Ara", email = "kiarash.ara@gmail.com" }]

[tool.hatch.build.targets.wheel]
packages = ["src/mcpinn"]
